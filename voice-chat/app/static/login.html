<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LingoCoach</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101826'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23e7eef8'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101826;
      --bg-2: #182334;
      --ink: #e7eef8;
      --muted: #93a4bd;
      --line: #2c3c55;
      --accent: #3c7dff;
      --accent-ink: #ffffff;
      --danger: #c24141;
      font-family: "Segoe UI", "PingFang HK", "Noto Sans CJK TC", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #070b14; color: var(--ink); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .phone {
      width: min(480px, 100%);
      height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 16px;
      padding-top: max(24px, env(safe-area-inset-top));
    }
    .mark { font-weight: 700; letter-spacing: 0.01em; font-size: 1.35rem; margin: 0 0 8px; }
    .muted { color: var(--muted); margin: 0 0 20px; line-height: 1.4; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.92rem; color: var(--muted); }
    input[type="text"] {
      min-height: 48px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--bg-2);
      padding: 0 14px;
      letter-spacing: 0.35em;
      font-size: 1.25rem;
      text-align: center;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .primary {
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0 16px;
      font-weight: 600;
    }
    .primary:disabled { opacity: 0.55; cursor: default; }
    .err { color: #f0a0a0; min-height: 1.3em; margin: 4px 0 0; font-size: 0.92rem; }
    .langs { display: flex; gap: 8px; margin-top: 28px; }
    .langs button {
      min-height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg-2);
      padding: 0 12px;
      color: var(--muted);
    }
    .langs button[aria-pressed="true"] {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <div class="phone">
    <p class="mark">LingoCoach</p>
    <p class="muted" id="hint"></p>
    <form id="form" autocomplete="one-time-code">
      <label for="code" id="label"></label>
      <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
      <button class="primary" type="submit" id="submit"></button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="cmn">中文</button>
      <button type="button" data-lang="yue">粵</button>
    </div>
  </div>
  <script>
    const I18N = {
      en: {
        hint: "Enter the 6-digit code from your authenticator app to unlock.",
        label: "One-time code",
        submit: "Unlock",
        bad: "That code is not valid. Try the current code.",
        network: "Network error. Try again.",
      },
      cmn: {
        hint: "请输入身份验证器中的 6 位验证码以解锁。",
        label: "一次性验证码",
        submit: "解锁",
        bad: "验证码无效。请使用当前显示的验证码。",
        network: "网络错误，请重试。",
      },
      yue: {
        hint: "請輸入驗證器入面嘅 6 位密碼解鎖。",
        label: "一次性密碼",
        submit: "解鎖",
        bad: "密碼唔啱。請用而家顯示嗰個。",
        network: "網絡錯誤，請再試。",
      },
    };
    let lang = "en";
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("zh-hk") || nav.startsWith("zh-tw") || nav.includes("yue")) lang = "yue";
    else if (nav.startsWith("zh")) lang = "cmn";

    function paint() {
      const t = I18N[lang] || I18N.en;
      document.getElementById("hint").textContent = t.hint;
      document.getElementById("label").textContent = t.label;
      document.getElementById("submit").textContent = t.submit;
      document.querySelectorAll(".langs button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
      });
    }
    paint();
    document.querySelectorAll(".langs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        document.getElementById("err").textContent = "";
        paint();
      });
    });

    const form = document.getElementById("form");
    const codeInput = document.getElementById("code");
    const err = document.getElementById("err");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      err.textContent = "";
      const code = codeInput.value.replace(/\D/g, "");
      if (code.length !== 6) {
        err.textContent = (I18N[lang] || I18N.en).bad;
        return;
      }
      submit.disabled = true;
      try {
        const response = await fetch("/api/totp/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ code }),
          credentials: "same-origin",
        });
        if (response.ok) {
          window.location.replace("/");
          return;
        }
        err.textContent = (I18N[lang] || I18N.en).bad;
      } catch (_) {
        err.textContent = (I18N[lang] || I18N.en).network;
      } finally {
        submit.disabled = false;
      }
    });
    codeInput.focus();
  </script>
</body>
</html>
