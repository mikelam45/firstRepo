[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-eval"
version = "0.1.0"
description = "Local Thunderbird mbox + LLM candidate screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
]

[project.scripts]
candidate-eval = "candidate_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
candidate_eval = ["templates/*.html"]
