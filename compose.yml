# Local deployment with Podman or Docker Compose — HTTP UI on port 3036.
#
# Podman:  podman compose up --build
# Docker:  docker compose up --build
# Then open: http://127.0.0.1:3036

name: candidate-eval

services:
  screener:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/candidate-eval:local
    container_name: candidate-eval
    env_file:
      - .env
    environment:
      THUNDERBIRD_MAIL_PATH: /data/mail
      OUTPUT_DIR: /data/output
      ROLE_CONFIG_PATH: /app/config/role_requirements.yaml
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.containers.internal:1234/v1}
      HOST: 0.0.0.0
      PORT: "3036"
    ports:
      - "${PORT:-3036}:3036"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MAIL_HOST_PATH:-./fixtures/mbox}:/data/mail:ro
      - ${OUTPUT_HOST_PATH:-./output/candidate_reviews}:/data/output:rw
      - ./config/role_requirements.yaml:/app/config/role_requirements.yaml:ro
    command: ["serve"]
    restart: unless-stopped
